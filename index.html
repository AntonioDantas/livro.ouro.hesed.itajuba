    <script>
    // === Geração Dinâmica das Páginas (Síncrona) ===
    (function() {
        var people = [];
        if (typeof peopleData !== 'undefined') {
            people = peopleData;
        } else {
            console.warn("Variável peopleData não encontrada. O livro carregará apenas as páginas fixas.");
        }

        people.sort(function(a, b) { return a.Number - b.Number; });
        var itensPorPagina = 15;
        var newListPeople = [];
        for (var pi = 0; pi < people.length; pi++) {
            var p = people[pi];
            var names = p.Name.split('\n');
            for (var ni = 0; ni < names.length; ni++) {
                newListPeople.push({ Id: p.Id, Number: p.Number, Name: names[ni].replace(/\r/g, '') });
            }
        }
        
        window.qtdFaltante = 800 - people.length;
        var numeroDePaginas = Math.ceil(newListPeople.length / itensPorPagina);
        
        // Garante que o número total de páginas seja par (para ter a contracapa)
        var totalPages = 7 + numeroDePaginas;
        var needsExtraPage = (totalPages % 2 !== 0);
        
        window.generatedDeeplinks = '';
        window.generatedPages = '';
        
        for (var i = 0; i < numeroDePaginas; i++) {
            var pageItems = newListPeople.slice(i * itensPorPagina, (i + 1) * itensPorPagina);
            var lines = [];
            for (var k = 0; k < pageItems.length; k++) {
                var x = pageItems[k];
                var itemText = x.Name;
                
                var first = null;
                for (var j = 0; j < newListPeople.length; j++) {
                    if (newListPeople[j].Number === x.Number) {
                        first = newListPeople[j];
                        break;
                    }
                }
                
                var hasSiblings = false;
                for (var j = 0; j < newListPeople.length; j++) {
                    if (newListPeople[j].Number === x.Number && newListPeople[j] !== x) {
                        hasSiblings = true;
                        break;
                    }
                }
                
                if (hasSiblings && first.Name !== x.Name) {
                    var spaces = '';
                    var numLen = x.Number.toString().length + 5;
                    for (var s = 0; s < numLen; s++) {
                        spaces += '&nbsp;';
                    }
                    lines.push(spaces + itemText);
                } else {
                    lines.push(x.Number + ' - ' + itemText);
                }
            }
            
            var pageNum = i + 8;
            var nomesHtml = lines.join('<br>').trim();
            
            window.generatedPages += 
                '<!-- begin page ' + pageNum + ' -->' +
                '<div data-background-image="img/Nomes.jpg">' +
                    '<div class="nomes">' + nomesHtml + '<\/div>' +
                    '<div class="fb5-cont-page-book">' +
                        '<div class="fb5-gradient-page"><\/div>' +
                        '<canvas id="canv' + pageNum + '"><\/canvas>' +
                        '<div class="fb5-page-book"><\/div>' +
                    '<\/div>' +
                '<\/div>' +
                '<!-- end page ' + pageNum + ' -->\n';
            
            window.generatedDeeplinks += '<li data-address="page' + pageNum + '" data-page="' + pageNum + '"><\/li>\n';
        }
        
        if (needsExtraPage) {
            var extraPageNum = 7 + numeroDePaginas + 1;
            window.generatedPages += 
                '<!-- begin page ' + extraPageNum + ' -->' +
                '<div data-background-image="img/nomes_fundo.jpg">' +
                    '<div class="nomes"><\/div>' +
                    '<div class="fb5-cont-page-book">' +
                        '<div class="fb5-gradient-page"><\/div>' +
                        '<canvas id="canv' + extraPageNum + '"><\/canvas>' +
                        '<div class="fb5-page-book"><\/div>' +
                    '<\/div>' +
                '<\/div>' +
                '<!-- end page ' + extraPageNum + ' -->\n';
            
            window.generatedDeeplinks += '<li data-address="page' + extraPageNum + '" data-page="' + extraPageNum + '"><\/li>\n';
        }
    })();
    </script>
