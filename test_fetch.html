<!DOCTYPE html>
<html><body>
<script>
fetch('App_Data/People.json').then(res => res.json()).then(data => {
    document.body.innerHTML = '<h1>Success! ' + data.length + ' items</h1>';
}).catch(err => {
    document.body.innerHTML = '<h1>Error: ' + err.message + '</h1>';
});
</script>
</body></html>
